[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
unknown = "2X5DHDfcqKLisg7ss6s7FLpUEr2B48ax73EKRgYGWiTW"

[programs.localnet]
unknown = "2X5DHDfcqKLisg7ss6s7FLpUEr2B48ax73EKRgYGWiTW"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.test.ts\""

[test]
startup_wait = 20000


