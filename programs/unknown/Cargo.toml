[package]
name = "unknown"
version = "0.1.0"
description = "Unknown — a Solana launchpad where fate decides what the dev can dump"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "unknown"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Local testing: randomness is injected by the admin instead of ORAO VRF.
mock-vrf = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions", "associated_token"] }
orao-solana-vrf = { version = "0.7.0", default-features = false, features = ["cpi"] }
solana-sha256-hasher = "2"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
